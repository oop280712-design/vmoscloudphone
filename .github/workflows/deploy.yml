name: VMOS Cloud Android Runner

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: 'Android Version'
        required: true
        default: '11.0.0'
        type: choice
        options:
          - '11.0.0'
          - '12.0.0'
          - '10.0.0'

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Install Dependencies & Kernel Modules
        run: |
          sudo apt update
          sudo apt install -y linux-modules-extra-$(uname -r) docker.io curl
          sudo modprobe ashmem_linux || true
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" || true

      - name: 3. Set up ngrok Authtoken
        run: |
          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install ngrok -y
          ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: 4. Launch ReDroid Container (Android Cloud Phone)
        run: |
          docker run -d --privileged \
            --name redroid \
            -v /data/android:/data \
            -p 5555:5555 \
            redroid/redroid:${{ github.event.inputs.android_version }}-latest \
            androidboot.hardware=redroid \
            redroid.width=720 \
            redroid.height=1280 \
            redroid.fps=60

      - name: 5. Wait for Android to Boot & Connect ADB
        run: |
          sudo apt install -y android-tools-adb
          echo "Waiting for Android container to initialize..."
          sleep 15
          adb connect 127.0.0.1:5555 || true

      - name: 5.1 Spoof Device Identity (Samsung S23 Ultra)
        run: |
          adb shell "setprop ro.product.model 'SM-S918B'"
          adb shell "setprop ro.product.brand 'samsung'"
          adb shell "setprop ro.product.name 'e3q'"
          adb shell "setprop ro.product.device 'e3q'"
          adb shell "setprop ro.product.manufacturer 'samsung'"
          # Randomize Android ID
          RANDOM_ID=$(head /dev/urandom | tr -dc a-f0-9 | head -c 16)
          adb shell "settings put secure android_id $RANDOM_ID"
          echo "Device identity spoofed successfully. New Android ID: $RANDOM_ID"

      - name: 6. Start WebRTC / Scrcpy Stream Server & Tunneling
        run: |
          echo "Starting ngrok TCP Tunnel on port 5555..."
          ngrok tcp 5555 --log=stdout > ngrok.log &
          sleep 5
          
          NGROK_URL=$(curl -s http://localhost:4040/api/tunnels | grep -o 'tcp://[^"]*' | head -n 1)
          echo "=================================================="
          echo " VMOS Cloud Phone Stream URL:"
          echo " $NGROK_URL"
          echo "=================================================="

      - name: 7. Keep Cloud Phone Alive (Max 6 Hours)
        run: |
          echo "Android Cloud Phone is now live and running!"
          # Keep container active for GitHub Actions runtime limit
          sleep 21600
