name: VMOS Cloud Android Runner

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: 'Android Version'
        required: true
        default: '11.0.0'
        type: choice
        options:
          - '11.0.0'
          - '12.0.0'
          - '10.0.0'
      keep_alive_time:
        description: 'Select Run Duration (Max 6 Hours)'
        required: true
        default: '21600'
        type: choice
        options:
          - '3600'   # 1 ชั่วโมง
          - '7200'   # 2 ชั่วโมง
          - '14400'  # 4 ชั่วโมง
          - '21600'  # 6 ชั่วโมง

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Load Kernel Modules
        run: |
          sudo modprobe ashmem_linux || true
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" || true

      - name: 3. Launch ReDroid Container (Android Cloud Phone)
        run: |
          docker run -d --privileged \
            --name redroid \
            -v /data/android:/data \
            -p 5555:5555 \
            redroid/redroid:${{ github.event.inputs.android_version }}-latest \
            androidboot.hardware=redroid \
            redroid.width=720 \
            redroid.height=1280 \
            redroid.fps=60

      - name: 4. Start Tunneling & Display URL (Pinggy)
        run: |
          echo "Starting Pinggy TCP Tunnel on port 5555..."
          ssh -p 443 -R0:localhost:5555 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 qr@a.pinggy.io > tunnel.log 2>&1 &
          sleep 5
          
          echo "=================================================="
          echo " VMOS Cloud Phone Stream Connection:"
          cat tunnel.log | grep -E "tcp://" || cat tunnel.log
          echo "=================================================="

      - name: 5. Keep Cloud Phone Alive
        run: |
          echo "Android Cloud Phone is running for ${{ github.event.inputs.keep_alive_time }} seconds..."
          sleep ${{ github.event.inputs.keep_alive_time }}
